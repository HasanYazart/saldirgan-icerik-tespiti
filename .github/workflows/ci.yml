name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q backend_api tests
      - name: Test
        run: pytest --cov=backend_api --cov-report=term-missing
      - name: Migration smoke test
        env:
          DATABASE_URL: sqlite:///./ci_migration.db
          SECRET_KEY: ci-secret-key-with-more-than-32-characters
        run: alembic upgrade head

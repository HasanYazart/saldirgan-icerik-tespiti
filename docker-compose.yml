services:
  moderation-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/toxic_chat.db
      MODEL_DIR: /app/model
    volumes:
      - moderation-data:/app/data
      - ./model:/app/model:ro
    restart: unless-stopped

volumes:
  moderation-data:
